<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golem — Live Playground</title>
    <meta name="description" content="Interactive live playground for the Golem declarative SVG graphing engine." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Math.js — expression evaluator, required by GolemCompiler -->
    <script src="https://cdn.jsdelivr.net/npm/mathjs@13/lib/browser/math.min.js"></script>
    <!--
      Golem — served from CDN (published package).
      `@1` is a semver range, not an exact pin: jsDelivr resolves it to the
      newest 1.x, so a release reaches the playground on its own and this line
      never goes stale. Edge caches the resolution for ~12h.
    -->
    <script src="https://cdn.jsdelivr.net/npm/golem-graph@1/dist/golem.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
