name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a "chore(release): x.y.z" pull request open, rebuilt from the
  # conventional-commit messages on main. Merging that PR tags the release and
  # is what triggers the publish job below.
  release-please:
    name: Prepare release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/golem-graph
    permissions:
      contents: read
      # Required for npm trusted publishing: npm verifies this workflow via
      # OIDC instead of a stored token, and stamps the package with provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1, newer than what ships with Node 22.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      # prepublishOnly runs the full test suite and both builds before this
      # uploads anything, so a broken tree cannot reach the registry.
      # No NODE_AUTH_TOKEN: authentication comes from the OIDC token above.
      - name: Publish
        run: npm publish
